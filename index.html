<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>waiting</title>
        <link rel="icon" type="image/x-icon" href="./assets/core/clock_icon.png">

        <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.1/core.css">
        <script type="module" src="https://pyscript.net/releases/2026.7.1/core.js"></script>

        <script type="module"> import "./js/core.js?v=999"; </script>
        <script type="py" src="./py/core.py"></script>
    </head>
    <body>
        <div id="_core_attribute"></div>

        <div id="_loading_box"></div>
        <!--<div id="_cursor_box"></div>-->

        <!--<div id="_kitty_background"></div>
        <div id="_secret_kitty"></div> -->

        <span id="_version_title">ALPHA : Version 1.0</span>
        
        <div id="_win_button" class="refresh">
            <span id="_refresh_txt">refresh</span>
        </div>

        <div id="_win_border"; class="maze_core">
            <div style="background: #000080; color: white; padding: 3px 5px; font-family: sans-serif; font-size: 12px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; cursor: default;">
                <span font-family: sans-serif;>labyrinth.exe</span>
                <div style="display: flex; gap: 2px;">
                    <button style="background: #c0c0c0; border-top: 1px solid #ffffff; border-left: 1px solid #ffffff; border-right: 1px solid #808080; border-bottom: 1px solid #808080; width: 18px; height: 16px; font-size: 20px; font-weight: bold; display: flex; align-items: center; justify-content: center; line-height: 0; padding: 0; cursor: pointer;">
                        <span style="transform: translateY(-4px);">_</span>
                    </button>

                    <button style="background: #c0c0c0; border-top: 1px solid #ffffff; border-left: 1px solid #ffffff; border-right: 1px solid #808080; border-bottom: 1px solid #808080; width: 18px; height: 16px; font-size: 20px; font-weight: bold; display: flex; align-items: center; justify-content: center; line-height: 0; padding: 0; cursor: pointer;">
                        <span style="transform: translateY(-1px);">□</span>
                    </button>
                    
                    <button style="background: #c0c0c0; border-top: 1px solid #ffffff; border-left: 1px solid #ffffff; border-right: 1px solid #808080; border-bottom: 1px solid #808080; width: 18px; height: 16px; font-size: 20px; font-weight: bold; display: flex; align-items: center; justify-content: center; line-height: 0; padding: 0; cursor: pointer;">
                        <span style="transform: translateY(-1px);">×</span>
                    </button>
                </div>
            </div>

            <div id="_maze_container" style="position: relative; width: 575px; height: 475px; background: #000; margin: 4px 0 0 0; padding: 0; border-top: 2px solid #808080; border-left: 2px solid #808080; border-right: 2px solid #ffffff; border-bottom: 2px solid #ffffff;">
                <canvas id="_maze_canvas" style="width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges;"></canvas>
            </div>
        </div>

        <div id="_win_border" class="maze_details">
            <div style="background: #000080; color: white; padding: 3px 5px; font-family: sans-serif; font-size: 12px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; cursor: default;">
                <span style="font-family: sans-serif;">details.info</span>
                <div style="display: flex; gap: 2px;">
                    <button style="background: #c0c0c0; border-top: 1px solid #ffffff; border-left: 1px solid #ffffff; border-right: 1px solid #808080; border-bottom: 1px solid #808080; width: 18px; height: 16px; font-size: 20px; font-weight: bold; display: flex; align-items: center; justify-content: center; line-height: 0; padding: 0; cursor: pointer;">
                        <span style="transform: translateY(-4px);">_</span>
                    </button>
                    <button style="background: #c0c0c0; border-top: 1px solid #ffffff; border-left: 1px solid #ffffff; border-right: 1px solid #808080; border-bottom: 1px solid #808080; width: 18px; height: 16px; font-size: 20px; font-weight: bold; display: flex; align-items: center; justify-content: center; line-height: 0; padding: 0; cursor: pointer;">
                        <span style="transform: translateY(-1px);">□</span>
                    </button>
                    <button style="background: #c0c0c0; border-top: 1px solid #ffffff; border-left: 1px solid #ffffff; border-right: 1px solid #808080; border-bottom: 1px solid #808080; width: 18px; height: 16px; font-size: 20px; font-weight: bold; display: flex; align-items: center; justify-content: center; line-height: 0; padding: 0; cursor: pointer;">
                        <span style="transform: translateY(-1px);">×</span>
                    </button>
                </div>
            </div>

            <div id="_details_container" style="position: relative; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; font-family: sans-serif; font-size: 24px; font-weight: bold; width: 190px; height: 100px; background: #c0c0c0; margin: 4px 0 0 0; padding: 8px; box-sizing: border-box; border-top: 2px solid #808080; border-left: 2px solid #808080; border-right: 2px solid #ffffff; border-bottom: 2px solid #ffffff; gap: 4px;">
                <span id="_level_txt" style="font-family: sans-serif;">Level: N/A</span>
                <span id="_map_size_txt" style="font-family: sans-serif;">Map size: N/A</span>
            </div>
        </div>

        <div id="_texture_slots" style="display: none;">
            <img id="tex_ceiling" src="./assets/other/maze/stone_brick.png" alt="Ceiling Texture">
            <img id="tex_wall" src="./assets/other/maze/brick.png" alt="Wall Texture">
            <img id="tex_floor" src="./assets/other/maze/plank.png" alt="Floor Texture">
            <img id="tex_smile" src="./assets/other/maze/smile.png" alt="Smile Texture">
            <img id="tex_key" src="./assets/other/maze/keys.png" alt="key Texture">
            <img id="tex_door" src="./assets/other/maze/door.png" alt="door Texture">
        </div>
        
        <div id="_audio_slots" style="display: none;">
            <audio id="snd_orb" src="./assets/other/sfxs/CY_MENUC.wav" preload="auto" type="audio/wav"></audio>
            <audio id="snd_build" src="./assets/other/sfxs/AR_CRITI.WAV" preload="auto" type="audio/wav"></audio>
            <audio id="snd_key" src="./assets/other/sfxs/PD_RINGO.WAV" preload="auto" type="audio/wav"></audio>
            <audio id="snd_door" src="./assets/other/sfxs/hall_elev_door.wav" preload="auto" type="audio/wav"></audio>
        </div>

        <div id="_clock_base">
            <div class="number" style="--i:1;"><div class="click-collapse">1</div></div>
            <div class="number" style="--i:2;"><div class="click-collapse">2</div></div>
            <div class="number" style="--i:3;"><div class="click-collapse">3</div></div>
            <div class="number" style="--i:4;"><div class="click-collapse">4</div></div>
            <div class="number" style="--i:5;"><div class="click-collapse">5</div></div>
            <div class="number" style="--i:6;"><div class="click-collapse">6</div></div>
            <div class="number" style="--i:7;"><div class="click-collapse">7</div></div>
            <div class="number" style="--i:8;"><div class="click-collapse">8</div></div>
            <div class="number" style="--i:9;"><div class="click-collapse">9</div></div>
            <div class="number" style="--i:10;"><div class="click-collapse">10</div></div>
            <div class="number" style="--i:11;"><div class="click-collapse">11</div></div>
            <div class="number" style="--i:12;"><div class="click-collapse">12</div></div>

            <div id="hour-hand" class="hand"></div>
            <div id="minute-hand" class="hand"></div>
            <div id="second-hand" class="hand"></div>
            <div id="center-pin"></div>
        </div>
    </body>
</html>
